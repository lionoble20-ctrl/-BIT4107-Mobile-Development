name: retailapp
description: "Intelligent Retail Analytics Engine"
publish_to: 'none'
version:version: 1.1.1+3

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.9.0
  sembast: ^3.7.3
  sembast_web: ^2.4.2
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  http: ^1.6.0
  crypto: ^3.0.7
  connectivity_plus: ^7.0.0
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  geocoding: ^4.0.0
  google_generative_ai: ^0.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#8B2FC9"
  adaptive_icon_foreground: "assets/icon/app_icon.png"